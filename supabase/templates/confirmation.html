  <body style="margin:0;background:#07060f;padding:32px 16px;color:#ede8ff;font-family:'Noto Serif SC','Songti SC',Georgia,serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;border:1px solid #493d27;border-radius:20px;background:#0e0c1e;overflow:hidden;">
            <tr>
              <td align="center" style="padding:36px 28px 16px;">
                <div style="font-size:11px;letter-spacing:5px;color:#7eb8a0;">私人云端命册</div>
                <div style="margin-top:12px;font-size:52px;line-height:1;letter-spacing:14px;color:#e8c88a;">爻光</div>

              </td>
            </tr>
            <tr>
              <td style="padding:12px 28px 34px;">
                <div style="border-top:1px solid #2e2742;padding-top:28px;text-align:center;">
                  <div style="font-size:22px;letter-spacing:4px;color:#ede8ff;">验明命册</div>
                  <p style="margin:14px 0 0;font-size:14px;line-height:1.8;color:#a89ec8;">请在爻光注册页面输入以下六位验证码。<br>验证码将在短时间后失效，请勿转发给他人。</p>
                  <div style="margin:26px auto 22px;border:1px solid #6e5b35;border-radius:14px;background:#151228;padding:19px 12px;color:#e8c88a;font-family:'Courier New',ui-monospace,monospace;font-size:34px;font-weight:700;line-height:1;letter-spacing:12px;white-space:nowrap;">{{ .Token }}</div>
                  <p style="margin:0;font-size:12px;line-height:1.8;color:#5c5480;">若不是你本人申请注册，可直接忽略此邮件。<br>爻光仅作娱乐，不影响真实命运。</p>
                </div>
              </td>
            </tr>
          </table>
          <div style="padding:18px 0;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#5c5480;">YAOGUANG · CYBER FORTUNE</div>
        </td>
